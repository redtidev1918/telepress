name: Release Control Canary

on:
  workflow_dispatch:
    inputs:
      version: {description: "Existing version; blank reads the manifest", required: false, type: string}
      dry_run: {description: "Build and validate without publishing", required: false, default: true, type: boolean}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    uses: redtidev1918/release-infra/.github/workflows/reusable-release.yml@v1
    with:
      version: ${{ inputs.version || '' }}
      dry_run: ${{ inputs.dry_run || true }}
    secrets: inherit
